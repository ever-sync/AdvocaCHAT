    <script>
      // Aplica o tema salvo antes da pintura, evitando flash branco no modo escuro.
      // O dark mode é preferência individual e só vale dentro do painel: rotas
      // públicas (login, cadastro, site) ficam sempre no tema claro.
      (function () {
        try {
          var p = window.location.pathname;
          var isPublic =
            p === "/" ||
            /^\/(login|cadastro|recuperar-senha|ativar-acesso|redefinir-senha|embed|agendar)(\/|$)/.test(p);
          if (!isPublic && localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
